# CONFIG TEMPLATE — once: cp config.example.yaml config.yaml, then set local values (DB host 192.168.5.5).
# Real config.yaml is GITIGNORED. Runtime values may also be supplied through GF_* environment variables.
server:
  address: "127.0.0.1:8083"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
logger:
  level: "info"
  stdout: true
database:
  default:
    # GoFrame's pgsql driver builds the DSN from these structured fields (it does
    # NOT parse a `link` string). Override per field via GF_DATABASE_DEFAULT_HOST,
    # _PORT, _USER, _PASS, _NAME.
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "postgres"
    name: "resource"

resource:
  siteSlug: "resource-local"
  traffic:
    # Immutable after this siteSlug's traffic instance is initialized.
    timeZone: "Asia/Shanghai"
  brand: "资源库"
  domain: "resource.localhost"
  siteUrl: "http://localhost:3001"
  siteDescription: "免费资源、工具与素材"
  locale: "zh-CN"
  discovery:
    ttl: "5m"
  # Used only when this Resource authorization instance is created. Afterwards
  # the instance database is authoritative; changing config does not alter grants.
  authorization:
    bootstrapAdministratorSubs:
      - "TestA123" # test@example.com (dev administrator)
  assetSpace: "default"
  assetNamespace: "default"
  assetProfile: "resource"
  # IdP JWKS for user access-token verification (Foundation auth). Lazy-fetched.
  jwks:
    url: "http://localhost:8081/oauth2/jwks.json"
    issuer: "http://localhost:8081"
    audience: ""
    allowLoopbackHttp: true # local development only
  assetService:
    baseUrl: "http://localhost:8082"   # the asset service (子项目②); files are public,
                                       # delivered from the stable CDN URL (site is free).
  coverCategory: "resource-cover"       # asset-service category for cover images (public)
  types:                                # type slug -> upload policy (maps to asset-service category)
    software: { label: "软件/工具",   allowedExt: ["zip", "exe", "dmg", "msi"], maxSizeMb: 500 }
    design:   { label: "设计素材/模板", allowedExt: ["zip", "psd", "ai", "fig", "sketch"], maxSizeMb: 200 }
    script:   { label: "脚本",        allowedExt: ["zip", "sh", "py", "js", "ps1"], maxSizeMb: 50 }
    default:  { label: "其它",        allowedExt: ["zip", "pdf"], maxSizeMb: 200 }
